[build-system]
requires = ["setuptools", "wheel", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "hummingbot"
version = "2.17.0"
description = "Hummingbot - Open source crypto trading bot"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Hummingbot Foundation", email = "dev@hummingbot.org"},
]
keywords = ["crypto", "trading", "bot", "market-making", "arbitrage"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp",
    "asyncssh",
    "aioprocessing",
    "aioresponses",
    "aiounittest",
    "aptos-sdk",
    "async-timeout",
    "base58",
    "bidict",
    "cachetools",
    "commlib-py",
    "cryptography",
    "decibel-python-sdk>=0.2.1,<0.3",
    "eth-account",
    "msgpack",
    "numba",
    "numpy",
    "objgraph",
    "pandas",
    "prompt_toolkit",
    "ptpython",
    "appdirs",
    "protobuf",
    "psutil",
    "pydantic",
    "pyjwt",
    "pyperclip",
    "requests",
    "ruamel.yaml",
    "safe-pysha3",
    "scalecodec",
    "scipy",
    "six",
    "solders",
    "sqlalchemy",
    "tabulate",
    "TA-Lib",
    "tqdm",
    "ujson",
    "urllib3",
    "web3",
    "xrpl-py",
    "PyYaml",
    "aiomqtt",
    "Brotli",
    "ft-pandas-ta",
    "typer",
    "lighter-sdk",
    "v4-proto",
    "bip-utils",
]

[project.optional-dependencies]
injective = [
    "injective-py",
]

[project.urls]
Homepage = "https://github.com/hummingbot/hummingbot"
Documentation = "https://docs.hummingbot.org"
Repository = "https://github.com/hummingbot/hummingbot"

[project.scripts]
hummingbot_quickstart = "hummingbot.client.quickstart:main"
hbot = "hummingbot.cli.main:main"



[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "Cython",
    "setuptools",
    "grpcio",
    "solders",
    "mock",
    "pytest-cov",
    "pytest-xdist",
]

[tool.uv]
override-dependencies = ["coincurve>=21", "numba>=0.65", "numpy>=2.4", "pandas>=3", "protobuf>=6.31.1,<7"]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["test"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::DeprecationWarning:websockets",
    "ignore::pytest.PytestCollectionWarning",
    "ignore:There is no current event loop:DeprecationWarning",
]
asyncio_default_fixture_loop_scope = "function"
# Fail any single test that runs longer than this (seconds) instead of hanging the
# whole CI run. Uses the SIGALRM-based method so a timed-out test raises in the main
# thread and the suite continues, surfacing every real failure in one run.
timeout = 120
timeout_method = "signal"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["hummingbot"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hummingbot*"]

[tool.setuptools.package-data]
hummingbot = ["VERSION", "templates/*TEMPLATE.yml", "core/cpp/*", "**/*.pxd", "**/*.pyx"]

[tool.uv.sources]
injective-py = { path = "vendor/injective-py", editable = true }
lighter-sdk = { path = "vendor/lighter-sdk", editable = true }
ft-pandas-ta = { path = "vendor/ft-pandas-ta", editable = true }
coincurve = { git = "https://github.com/ofek/coincurve.git", rev = "2d11b1160c75ae8fd94fe8fe3f226aec176bf9bf" }

aioresponses = { path = "vendor/aioresponses", editable = true }
