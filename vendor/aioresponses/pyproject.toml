[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "aioresponses"
version = "0.7.9+ayu.1"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["aiohttp", "packaging"]
[tool.hatch.build.targets.wheel]
packages = ["src/aioresponses"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/aioresponses" = "aioresponses"
