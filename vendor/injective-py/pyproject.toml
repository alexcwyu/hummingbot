[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "injective-py"
version = "1.16.2+ayu.1"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["aiohttp (>=3.9.4,<4.0.0)", "bech32", "bip32", "ecdsa", "eip712 (>=0.3.0,<0.4.0)", "eth-pydantic-types (>=0.2.4,<0.3.0)", "grpcio", "grpcio-tools", "hdwallets", "mnemonic", "protobuf>=6.31.1,<7", "requests", "safe-pysha3", "web3 (>=7.0.0,<8.0.0)", "websockets"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyinjective"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyinjective" = "pyinjective"
