[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lighter-sdk"
version = "1.1.6+ayu.1"
description = "Latest Lighter SDK with the current asynchronous WebSocket import"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["urllib3>=2", "python-dateutil", "aiohttp>=3", "aiohttp-retry>=2.8.3", "pydantic>=2", "typing-extensions>=4.7.1", "websockets>=12", "eth-account>=0.13.4", "requests>=2.31.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lighter"]
dev-mode-dirs = ["src"]
[tool.hatch.build.targets.wheel.force-include]
"src/lighter" = "lighter"
